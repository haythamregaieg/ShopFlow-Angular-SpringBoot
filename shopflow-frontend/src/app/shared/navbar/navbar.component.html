<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="nav-brand">
      <span class="brand-mark">🧸</span>
      <span class="brand-block">
        <span class="brand-text">ShopFlow</span>
        <span class="brand-sub">enfants</span>
      </span>
    </a>

    <div class="nav-links">
      <a routerLink="/products" routerLinkActive="active" class="nav-icon-link" title="Catalogue">
        <i class="fas fa-tshirt"></i>
      </a>
      <a routerLink="/orders" routerLinkActive="active" *ngIf="isLoggedIn" class="nav-icon-link" title="Mes commandes">
        <i class="fas fa-gift"></i>
        <span class="notification-badge" *ngIf="notificationCount > 0">{{ notificationCount }}</span>
      </a>
      <a routerLink="/cart" routerLinkActive="active" *ngIf="isLoggedIn" class="nav-icon-link cart-link" title="Panier">
        <i class="fas fa-shopping-bag"></i>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>
    </div>

    <div class="nav-auth">
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/auth/login" class="btn-link login-btn">Connexion</a>
        <a routerLink="/auth/register" class="btn-primary register-btn">Inscription</a>
      </ng-container>
      <ng-container *ngIf="isLoggedIn">
        <div class="user-menu-wrap">
          <button class="user-menu-trigger" (click)="toggleUserMenu()">
            <div class="user-avatar">{{ userInitial }}</div>
            <div class="user-info">
              <span class="user-name">{{ userFullName || userEmail.split('@')[0] }}</span>
              <span class="user-role-badge">{{ userRole }}</span>
            </div>
            <i class="fas fa-chevron-down menu-caret"></i>
          </button>
          <div class="user-dropdown" *ngIf="isUserMenuOpen">
            <a routerLink="/dashboard" (click)="closeUserMenu()">👤 Mon compte</a>
            <a routerLink="/profile" (click)="closeUserMenu()">📝 Profil</a>
            <a routerLink="/dashboard/seller" *ngIf="isSeller" (click)="closeUserMenu()">🏪 Gérer ma boutique</a>
            <a routerLink="/admin" *ngIf="isAdmin" (click)="closeUserMenu()">⚙️ Administration</a>
            <button class="logout-item" (click)="logout()">🚪 Déconnexion</button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</nav>
