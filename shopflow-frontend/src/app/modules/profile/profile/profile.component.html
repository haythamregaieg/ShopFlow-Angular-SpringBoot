<div class="profile-page">
  <div class="profile-container">

    <!-- En-tête moderne -->
    <header class="profile-header">
      <div class="header-icon" aria-hidden="true">👤</div>
      <div>
        <h1>Mon profil</h1>
        <p class="header-subtitle">Gérez vos informations personnelles et, si besoin, les données de votre boutique.</p>
      </div>
    </header>

    <!-- Messages -->
    <div class="alerts" *ngIf="success || error">
      <div class="alert success" *ngIf="success">{{ success }}</div>
      <div class="alert error" *ngIf="error">{{ error }}</div>
    </div>

    <!-- Informations utilisateur -->
    <section class="profile-card">
      <div class="card-header">
        <span class="card-icon">📝</span>
        <h2>Informations utilisateur</h2>
      </div>

      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
        <div class="form-grid">
          <div class="form-group">
            <label>Prénom *</label>
            <input type="text" formControlName="prenom" placeholder="Votre prénom">
          </div>
          <div class="form-group">
            <label>Nom *</label>
            <input type="text" formControlName="nom" placeholder="Votre nom">
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" [disabled]="true">
          <small>Adresse associée au compte (non modifiable)</small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save" [disabled]="profileForm.invalid">
            Enregistrer les changements
          </button>
        </div>
      </form>
    </section>

    <!-- Section boutique (uniquement pour vendeur) -->
    <section class="profile-card" *ngIf="isSeller">
      <div class="card-header">
        <span class="card-icon">🏪</span>
        <h2>Ma boutique</h2>
      </div>

      <form [formGroup]="sellerForm" (ngSubmit)="saveSellerProfile()">
        <div class="form-group">
          <label>Nom de la boutique *</label>
          <input type="text" formControlName="nomBoutique" placeholder="Nom de votre boutique">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea formControlName="description" rows="4" placeholder="Décrivez votre univers, vos valeurs..."></textarea>
        </div>

        <div class="form-group">
          <label>Logo (URL)</label>
          <input type="url" formControlName="logo" placeholder="https://...">
        </div>

        <div class="logo-preview" *ngIf="sellerForm.get('logo')?.value as logoUrl">
          <span class="logo-preview-label">Aperçu du logo</span>
          <div class="logo-preview-frame">
            <img [src]="logoUrl" alt="Logo de la boutique">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save" [disabled]="sellerForm.invalid">
            Mettre à jour la boutique
          </button>
        </div>
      </form>
    </section>

  </div>
</div>
