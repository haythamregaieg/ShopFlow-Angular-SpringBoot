<div class="profile-page">
  <div class="profile-shell">
    <header class="page-head">
      <div>
        <h1>Mon profil</h1>
        <p class="page-subtitle">Gerez vos informations personnelles et, si besoin, les donnees de votre boutique.</p>
      </div>
    </header>

    <div class="alerts">
      <div class="alert success" *ngIf="success">{{ success }}</div>
      <div class="alert error" *ngIf="error">{{ error }}</div>
    </div>

    <section class="surface">
      <div class="surface-head">
        <h2>Informations utilisateur</h2>
      </div>

      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
        <div class="field-grid">
          <div class="field">
            <label>Prenom</label>
            <input type="text" formControlName="prenom" placeholder="Votre prenom" />
          </div>
          <div class="field">
            <label>Nom</label>
            <input type="text" formControlName="nom" placeholder="Votre nom" />
          </div>
        </div>

        <div class="field">
          <label>Email</label>
          <input type="text" formControlName="email" placeholder="email@domaine.com" />
          <small>Adresse associee au compte (non modifiable).</small>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Enregistrer les changements</button>
        </div>
      </form>
    </section>

    <section class="surface" *ngIf="isSeller">
      <div class="surface-head">
        <h2>Ma boutique</h2>
      </div>

      <form [formGroup]="sellerForm" (ngSubmit)="saveSellerProfile()">
        <div class="field">
          <label>Nom boutique</label>
          <input type="text" formControlName="nomBoutique" placeholder="Nom de la boutique" />
        </div>
        <div class="field">
          <label>Description</label>
          <textarea formControlName="description" rows="4" placeholder="Decrivez votre boutique"></textarea>
        </div>
        <div class="field">
          <label>Logo (URL)</label>
          <input type="text" formControlName="logo" placeholder="https://..." />
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Mettre a jour la boutique</button>
        </div>
      </form>
    </section>
  </div>
</div>
