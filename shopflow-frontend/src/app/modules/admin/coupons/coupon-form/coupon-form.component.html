<div class="container py-4">
  <h2>{{ isEdit ? 'Modifier le coupon' : 'Nouveau coupon' }}</h2>

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="mb-3">
      <label class="form-label">Code</label>
      <input class="form-control" formControlName="code" />
    </div>

    <div class="mb-3">
      <label class="form-label">Type</label>
      <select class="form-select" formControlName="type">
        <option value="PERCENT">Pourcentage</option>
        <option value="AMOUNT">Montant fixe</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Valeur</label>
      <input type="number" class="form-control" formControlName="valeur" />
    </div>

    <div class="mb-3">
      <label class="form-label">Usages max</label>
      <input type="number" class="form-control" formControlName="usagesMax" />
    </div>

    <div class="mb-3">
      <label class="form-label">Date d'expiration</label>
      <input type="date" class="form-control" formControlName="dateExpiration" />
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" formControlName="actif" id="actif" />
      <label class="form-check-label" for="actif">Actif</label>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" [disabled]="loading">Enregistrer</button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
    </div>
  </form>

  <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
</div>
