<div class="container" style="padding-top: 30px;">
  <div class="admin-nav">
    <a routerLink="/admin/users" routerLinkActive="active" class="admin-tab">👥 Utilisateurs</a>
    <a routerLink="/admin/products" routerLinkActive="active" class="admin-tab">📦 Produits</a>
  <a routerLink="/admin/reviews" routerLinkActive="active" class="admin-tab">⭐ Avis</a>
  <a routerLink="/admin/coupons" routerLinkActive="active" class="admin-tab">🏷️ Coupons</a>
  </div>

  <div class="page-header">
    <h1 class="page-title">👥 Gestion des Utilisateurs</h1>
  </div>

  <div class="card">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Utilisateur</th>
          <th>Email</th>
          <th>Rôle</th>
          <th>Statut</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>
            <div class="user-info">
              <strong>{{ user.prenom }} {{ user.nom }}</strong>
            </div>
          </td>
          <td>{{ user.email }}</td>
          <td><span class="badge badge-info">{{ user.role }}</span></td>
          <td>
            <span class="badge" [class]="user.actif ? 'badge-success' : 'badge-danger'">
              {{ user.actif ? 'Actif' : 'Inactif' }}
            </span>
          </td>
          <td>
            <button class="btn btn-sm" [class]="user.actif ? 'btn-danger' : 'btn-success'"
              (click)="toggle(user)">
              {{ user.actif ? 'Désactiver' : 'Activer' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
