<div class="container" style="padding-top: 30px;">
  <div class="admin-nav">
    <a routerLink="/admin/users" routerLinkActive="active" class="admin-tab">👥 Utilisateurs</a>
    <a routerLink="/admin/products" routerLinkActive="active" class="admin-tab">📦 Produits</a>
    <a routerLink="/admin/reviews" routerLinkActive="active" class="admin-tab">⭐ Avis</a>
  </div>

  <div class="page-header">
    <h1 class="page-title">📦 Gestion des Produits</h1>
    <a routerLink="/products/new/create" class="btn btn-primary">+ Nouveau Produit</a>
  </div>

  <div class="card">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Prix</th>
          <th>Stock</th>
          <th>Vendeur</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td>{{ product.id }}</td>
          <td><strong>{{ product.nom }}</strong></td>
          <td>{{ product.prix | number:'1.2-2' }} €</td>
          <td>{{ product.stock }}</td>
          <td>{{ product.sellerNom || 'ShopFlow' }}</td>
          <td>
            <span class="badge" [class]="product.actif ? 'badge-success' : 'badge-danger'">
              {{ product.actif ? 'Actif' : 'Inactif' }}
            </span>
          </td>
          <td>
            <div class="action-buttons">
              <a [routerLink]="['/products', product.id, 'edit']" class="btn btn-outline-success btn-sm" title="Modifier">
                <i class="fas fa-edit"></i>
              </a>
              <button class="btn btn-outline-danger btn-sm" (click)="delete(product.id)" title="Désactiver">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
