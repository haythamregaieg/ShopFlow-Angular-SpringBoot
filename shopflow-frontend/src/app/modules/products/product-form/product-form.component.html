<div class="container" style="padding-top: 30px; max-width: 600px;">
  <div class="card">
    <h2 class="page-title">{{ isEdit ? '✏️ Modifier le produit' : '➕ Nouveau produit' }}</h2>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nom du produit *</label>
        <input type="text" formControlName="nom" placeholder="Ex: iPhone 15" />
        <span class="error-msg" *ngIf="form.get('nom')?.touched && form.get('nom')?.invalid">Nom obligatoire</span>
      </div>

      <div class="form-group">
        <label>Description *</label>
        <textarea formControlName="description" rows="3" placeholder="Description du produit..."></textarea>
        <span class="error-msg" *ngIf="form.get('description')?.touched && form.get('description')?.invalid">Description obligatoire</span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Prix (€) *</label>
          <input type="number" formControlName="prix" placeholder="0.00" step="0.01" />
        </div>
        <div class="form-group">
          <label>Prix promo (€)</label>
          <input type="number" formControlName="prixPromo" placeholder="0.00" step="0.01" />
        </div>
      </div>

      <div class="form-group">
        <label>Stock *</label>
        <input type="number" formControlName="stock" placeholder="Quantité disponible" />
      </div>

      <div class="form-group">
        <label>Image URL</label>
        <input type="text" formControlName="images" placeholder="https://..." />
      </div>

      <div class="form-actions">
        <button type="button" class="btn" routerLink="/products">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading || form.invalid">
          {{ loading ? 'Enregistrement...' : (isEdit ? 'Modifier' : 'Créer') }}
        </button>
      </div>
    </form>
  </div>
</div>
