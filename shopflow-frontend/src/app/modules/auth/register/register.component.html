<div class="auth-page">
  <div class="auth-left">
    <div class="auth-logo">ShopFlow</div>
    <h1>Rejoignez-nous !</h1>
    <p>Creez votre compte et commencez a acheter</p>
  </div>
  <div class="auth-right">
    <div class="auth-form-container fade-in">
      <div class="auth-header">
        <h2>Creer un compte</h2>
        <p>Inscription gratuite en quelques secondes</p>
      </div>
      <div class="alert alert-error" *ngIf="error">{{ error }}</div>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <div class="form-group">
            <label>Prenom</label>
            <input type="text" formControlName="prenom" placeholder="Marie" />
          </div>
          <div class="form-group">
            <label>Nom</label>
            <input type="text" formControlName="nom" placeholder="Dupont" />
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="votre@email.com" />
          <span class="error-msg" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            Email invalide
          </span>
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" formControlName="motDePasse" placeholder="8+ caracteres, Maj, min, chiffre, symbole" />
          <span class="error-msg" *ngIf="form.get('motDePasse')?.touched && form.get('motDePasse')?.invalid">
            Mot de passe fort requis
          </span>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" [checked]="asSeller" (change)="toggleSeller()" />
            Je veux m'inscrire comme vendeur
          </label>
        </div>
        <div *ngIf="asSeller">
          <div class="form-group">
            <label>Nom de la boutique</label>
            <input type="text" formControlName="nomBoutique" placeholder="Ma Boutique" />
          </div>
          <div class="form-group">
            <label>Logo (URL)</label>
            <input type="text" formControlName="logoBoutique" placeholder="https://..." />
          </div>
          <div class="form-group">
            <label>Description</label>
            <input type="text" formControlName="descriptionBoutique" placeholder="Description boutique" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" [disabled]="loading">
          {{ loading ? 'Inscription...' : 'S inscrire' }}
        </button>
      </form>
      <p class="auth-link">Deja un compte ? <a routerLink="/auth/login">Se connecter</a></p>
    </div>
  </div>
</div>
