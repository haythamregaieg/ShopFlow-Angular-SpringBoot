<div class="auth-page">

  <!-- LEFT SIDE -->
  <div class="auth-left">

    <a class="auth-logo" routerLink="/products">
      <div class="logo-icon">SF</div>
      <h1>ShopFlow</h1>
    </a>

    <h2>Créer un compte</h2>
    <p>Plateforme e-commerce moderne pour acheter et vendre facilement.</p>



  </div>

  <!-- RIGHT SIDE -->
  <div class="auth-right">

    <div class="auth-form-container fade-in">

      <div class="auth-header">
        <h2>Inscription</h2>
        <p>Rejoignez-nous en quelques secondes</p>
      </div>

      <div class="alert-error" *ngIf="error">
        <i class="fas fa-circle-exclamation"></i> {{ error }}
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <!-- SWITCH -->
        <div class="switch">

          <button type="button"
                  (click)="toggleSeller(false)"
                  [class.active]="!asSeller">
            👤 Client
          </button>

          <button type="button"
                  (click)="toggleSeller(true)"
                  [class.active]="asSeller">
            🛍️ Vendeur
          </button>

        </div>

        <!-- INPUTS -->
        <div class="grid">
          <input formControlName="prenom" placeholder="Prénom">
          <input formControlName="nom" placeholder="Nom">
        </div>

        <input formControlName="email" placeholder="Email">
        <input type="password" formControlName="motDePasse" placeholder="Mot de passe">

        <!-- SELLER -->
        <div class="seller" *ngIf="asSeller">
          <input formControlName="nomBoutique" placeholder="Nom boutique">
          <input formControlName="descriptionBoutique" placeholder="Description">
        </div>

       <label class="checkbox">

  <input type="checkbox" (change)="onTermsChange($event)">

  <span class="checkmark"></span>

  <span class="text">
    J’accepte les <a href="#">conditions d’utilisation</a>
  </span>

</label>


        <!-- BUTTON -->
        <button type="submit"
                class="btn-primary"
                [disabled]="loading || !acceptedTerms">

          <i class="fas fa-user-plus"></i>
          {{ loading ? 'Création...' : 'Créer mon compte' }}

        </button>

      </form>

      <!-- LOGIN LINK (même style que login) -->
      <p class="auth-link">
        Vous avez déjà un compte ?
        <a routerLink="/auth/login">Se connecter</a>
      </p>

    </div>

  </div>

</div>
