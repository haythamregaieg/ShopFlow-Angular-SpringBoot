<div class="container mt-4">
  <h2>Mes Commandes</h2>

  <div *ngIf="orders.length === 0" class="alert alert-info">
    Vous n'avez pas encore de commandes.
  </div>

  <div class="table-responsive" *ngIf="orders.length > 0">
    <table class="table table-hover">
      <thead class="thead-light">
        <tr>
          <th>N° Commande</th>
          <th>Date</th>
          <th>Total</th>
          <th>Statut</th>
          <th>Notification</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td>{{ order.numeroCommande }}</td>
          <td>{{ order.dateCommande | date:'dd/MM/yyyy' }}</td>
          <td>{{ order.totalTTC | number:'1.2-2' }} €</td>
          <td>
            <span class="badge" [ngClass]="'badge-' + order.statut.toLowerCase()">
              {{ order.statut }}
            </span>
          </td>
          <td>
            <span *ngIf="order.isNewStatus" class="badge badge-info" title="Statut mis a jour">
              Nouveau statut
            </span>
          </td>
          <td class="d-flex align-items-center gap-2">
            <a [routerLink]="['/orders', order.id]" class="btn btn-sm btn-primary">
              Voir détails
            </a>

            <!-- Seller controls: allow seller to change order status -->
            <div *ngIf="isSeller" class="d-flex align-items-center">
              <select class="form-select form-select-sm me-1" [(ngModel)]="order._selectedStatus">
                <option *ngFor="let s of getAvailableStatusesFor(order)" [value]="s">{{ s }}</option>
              </select>
              <button class="btn btn-sm btn-outline-secondary" (click)="updateStatus(order.id, order._selectedStatus)">
                Mettre à jour
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
